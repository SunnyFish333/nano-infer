[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoinfer"
version = "0.1.0"
authors = [{ name = "SunnyFish333" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "Nano Infer: a lightweight multi-model LLM inference engine"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=5.22.1,<5.23",
    "torchvision>=0.19",
    "Pillow>=10",
    "av>=14",
    "flash-attn",
    "xxhash",
    "numpy",
    "safetensors",
    "tqdm",
]

[project.urls]
Homepage="https://github.com/SunnyFish333/nano-infer"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoinfer*"]

[tool.coverage.report]
include_namespace_packages = true
